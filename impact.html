<!--
  DUSTPAN — Impact (customer page)
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DUSTPAN — Impact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="Css/shell.css" />
  <link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body class="dc-app" data-session-pill="off">

  <main class="dc-wrap">
    <div class="dc-head">
      <h1 class="dc-h1">Impact</h1>
      <p class="dc-sub">Waste isn't worthless. Every kilo you bring in stays out of drains and streets, and turns into value you can use.</p>
    </div>

    <div class="dc-alert err" data-w-error hidden role="alert"></div>

    <div class="dc-stats" style="margin-top:0">
      <div class="dc-stat"><b data-w="kg">—</b><span>Waste recovered</span></div>
      <div class="dc-stat"><b data-w="earned">—</b><span>DUST earned</span></div>
      <div class="dc-stat"><b data-w="deposits">—</b><span>Verified deposits</span></div>
      <div class="dc-stat"><b data-w="balance">—</b><span>DUST in your wallet</span></div>
    </div>

    <section class="dc-panel dc-section" id="impactMsg" hidden>
      <h2 class="dc-h2" id="impactTitle"></h2>
      <p class="dc-note" id="impactText" style="margin-top:.35rem"></p>
      <div class="dc-btn-row"><a class="dc-btn" href="deposit.html">How to deposit</a></div>
    </section>
  </main>

  <script type="module" src="js/shell.js"></script>
  <script type="module" src="js/session.js"></script>
  <script type="module">
    import { currentUser } from './js/auth.js';
    import { loadWallet, paintWallet, fmtKg } from './js/wallet.js';
    const user = await currentUser();
    if (user) {
      const view = await loadWallet(user);
      paintWallet(view);
      if (!view.error) {
        const s = view.summary;
        document.getElementById('impactTitle').textContent = s.kg > 0 ? `You have recovered ${fmtKg(s.kg)} of waste` : 'Your impact starts with your first deposit';
        document.getElementById('impactText').textContent = s.kg > 0
          ? 'Thank you. Keep going: every verified deposit adds to these totals.'
          : 'These numbers only count waste that staff have weighed and verified, so they start at zero.';
        document.getElementById('impactMsg').hidden = false;
      }
    }
  </script>
</body>
</html>
