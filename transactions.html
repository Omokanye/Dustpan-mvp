<!--
  DUSTPAN — Activity (customer page)
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DUSTPAN — Activity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="Css/shell.css" />
  <link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body class="dc-app" data-session-pill="off">

  <main class="dc-wrap">
    <div class="dc-head">
      <h1 class="dc-h1">Activity</h1>
      <p class="dc-sub">Every DUST you earn or spend, newest first.</p>
    </div>

    <div class="dc-alert err" id="loadError" hidden role="alert"></div>

    <section class="dc-panel">
      <ul class="dc-list" id="txList"></ul>
      <div id="txEmpty" class="dc-empty" hidden>
        <b>No activity yet</b>
        <span>Deposit waste to earn your first DUST.</span>
        <div class="dc-btn-row" style="justify-content:center"><a class="dc-btn" href="deposit.html">How to deposit</a></div>
      </div>
      <p class="dc-note" id="txMore" hidden style="margin-top:.75rem">Showing your latest 100.</p>
    </section>
  </main>

  <script type="module" src="js/shell.js"></script>
  <script type="module" src="js/session.js"></script>
  <script type="module">
    import { currentUser } from './js/auth.js';
    import { loadTransactions, renderTransactions, walletError } from './js/wallet.js';
    const $ = (id) => document.getElementById(id);
    const user = await currentUser();
    if (user) {
      try {
        const txs = await loadTransactions(user.id, 100);
        if (txs.length) { renderTransactions($('txList'), txs); $('txMore').hidden = txs.length < 100; }
        else $('txEmpty').hidden = false;
      } catch (err) {
        $('loadError').textContent = walletError(err);
        $('loadError').hidden = false;
      }
    }
  </script>
</body>
</html>
